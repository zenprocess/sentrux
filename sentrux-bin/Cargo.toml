[package]
name = "sentrux"
version = "0.5.7"
edition = "2021"
description = "Live codebase visualization and structural quality gate for AI-agent-written code"
license = "MIT"
repository = "https://github.com/sentrux/sentrux"
homepage = "https://github.com/sentrux/sentrux"

[lib]
name = "sentrux_bin"
path = "src/lib.rs"

[[bin]]
name = "sentrux"
path = "src/main.rs"

[dependencies]
sentrux-core = { path = "../sentrux-core" }
clap = { version = "4", features = ["derive"] }
eframe = { workspace = true }
egui = { workspace = true }
dirs = "6"

# SPEC-651 — `sentrux serve` axum HTTP daemon deps.
# Kept minimal so the GUI binary's footprint barely moves.
axum = { version = "0.7", features = ["json", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "fs", "net", "time"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
chrono = { version = "0.4", features = ["serde"] }

[features]
default = []
pro = ["sentrux-core/pro"]

[dev-dependencies]
ureq = { version = "2", features = ["json"] }
tempfile = "3"
